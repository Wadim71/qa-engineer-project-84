- summary: |
    Обновление текущей страницы возвращает пользователя на первую страницу каталога товаров
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Кликнуть на поле "Previus"("Предыдущая") или "Next" ("Следующая")
    3. После перехода на предыдущую или следующую страницу обновить её
  expected-result: |
    Пользователь должен оставаться на текущей странице после обновления
  actual-result: |
    После обновления страницы сайт возвращает пользователя на первую страницу каталога товаров

- summary: |
    Строка поиска товара по названию бренда или по названию товара работает некорректно
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Ввести название требуемого бренда или название требуемого товара в строке поиска
    3. Получить страницы с товаром запрашиваемого бренда или названия
  expected-result: |
    При использовании строки поиска товара по названию бренда или названию товара сайт должен показать весь товар запрашиваемого бренда или названия
  actual-result: |
    При использовании строки поиска товара по названию бренда или по названию товара сайт товар только текущей страницы

- summary: |
    Сайт оформляет отсутствующий товар
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Снять галочку на поле "In Stock"
    3. Найти товар, которого нет в наличии
    4. Кликнуть на поле выбранного товара
    5. После перехода на страницу товара кликнуть на поле "Add to cart" или "В корзину"
    6. Кликнуть на поле "Cart" или "Корзина"
    7. После перехода на страницу корзины кликнуть на поле "Checkout" или "Оформить заказ"
    8. При появлении окошка "Order placed successfully" или "Заказ успешно оформлен" нажать на поле "Close" или "Закрыть"
  expected-result: |
    Сайт не должен оформлять товар, которого нет в наличии
  actual-result: |
    Сайт оформляет товар, которого нет в наличии
