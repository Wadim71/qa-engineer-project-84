---
- summary: |
    Не работает перевод всего сайта после переключения на русский язык
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Кликнуть на поле "Language" или "Язык"
    3. Из выпавшего списка выбрать английский язык
    4. Кликнуть на поле "Language"
    5. Из выпавшего списка выбрать русский язык
    6. Выбрать любой товар
    7. Кликнуть на поле выбранного товара
    8. После перехода на страницу товара просмотреть информацию о товаре
  expected-result: |
    После переключения на русский язык весь сайт переводится на русский язык
  actual-result: |
    После переключения на русский язык весь сайт не переводится на русский язык
    
- summary: |
    Функция хэштэга товара на странице товара с переходом на страницу с соответствующей категорией товаров не работает
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Нажать на поле любого товара
    3. После перехода на страницу товара нажать на хэштэг
  expected-result: |
    После нажатия на хэштэг на странице любого товара пользователь должен переходить на страницу с соответствующей категорией товаров
  actual-result: |
    После нажатия на хэштэг на странице любого товара ничего не происходит

- summary: |
    Некорректно работает фильтр выбора категорий товаров, представленных на сайте
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Кликнуть на поле фильтра "Category"
    3. Из выпадающего списка выбрать категорию товара
  expected-result: |
    После нажатия на поле фильтра "Category" должен выпадать список всех категорий товаров, представленных на сайте магазина
  actual-result: |
    После нажатия на поле фильтра "Category" выпадает список категорий товаров, представленных только на текущей странице

- summary: |
    После оформления заказа товар остаётся в корзине
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Выбрать любой товар
    3. Кликнуть на поле выбранного товара
    4. После перехода на страницу товара кликнуть на поле "Add to cart" или "В корзину"
    5. Кликнуть на поле "Cart" или "Корзина"
    6. После перехода на страницу корзины кликнуть на поле "Checkout" или "Оформить заказ"
    7. При появлении окошка "Order placed successfully" или "Заказ успешно оформлен" нажать на поле "Close" или "Закрыть"
  expected-result: |
    После оформления заказа корзина должна быть пустой
  actual-result: |
    После оформления заказа в корзине остаётся оформленный товар

- summary: |
    После обновления любой страницы сайта удаленный товар из корзины опять появляется в корзине
  environment: |
    Chrome: Версия 125.0.6422.76 (Официальная сборка), (64 бит)
    ОС: Windows 10 Домашняя 22H2 19045.4412
  steps-to-reproduce: |
    1. Зайти на страницу https://hexlet-products-store.vercel.app
    2. Выбрать любой товар
    3. Кликнуть на поле выбранного товара
    4. После перехода на страницу товара кликнуть на поле "Add to cart" или "В корзину"
    5. Кликнуть на поле "Cart" или "Корзина"
    6. После перехода на страницу корзины нажимаем на поле "Clear cart" или "Очистить корзину"
    7. Кликаем на поле "Continue shopping" или "Продолжить покупки"
    8. Обновляем страницу
  expected-result: |
    После обновления любой страницы корзина должна оставаться пустой
  actual-result: |
    После обновления любой страницы удалённый товар опять оказывается в корзине

