- summary: |
    Проверка запросов и ответов с помощью Devtools через оформление заказа
  requirement: |
    При проверке через Devtools запросы и ответы должны быть без ошибок
  prerequisites:
    Пользователь находится на странице https://hexlet-products-store.vercel.app/
  test-data: |
    Empty
  steps:
    - На сайте выбрать любой товар в каталоге товаров
    - Нажать клавиши Ctrl+Shift+I либо нажать на правую кнопку мыши
    - В появившемся окне выбрать строку "Просмотреть код" и кликнуть на неё 
    - После открытия панели инструментов кликнуть на "Сеть"
    - На сайте в поле выбранного товара нажать на поле "Add to cart"
    - Обновить страницу
    - В панели инструментов нажать на поле Fetch/XHR
    - Нажать на строчку {}
    - В открывшемся окне в поле "Заголовки" просмотреть URL запроса, метод запроса и код статуса
    - Нажать на поле "Ответ" на панели инструментов
    - Внимательно изучить информацию
    - Далее на сайте кликнуть на поле "Cart"
    - Обновить страницу
    - В панели инструментов нажать на поле Fetch/XHR
    - Нажать на строчку {}
    - В открывшемся окне в поле "Заголовки" просмотреть URL запроса, метод запроса и код статуса
    - Нажать на поле "Ответ" на панели инструментов
    - Внимательно изучить информацию
    - На сайте после перехода на страницу корзины кликнуть на поле "Checkout"
    - При появлении окошка "Order placed successfully" нажать на поле "Close"
    - Обновить страницу
    - В панели инструментов нажать на поле Fetch/XHR
    - Нажать на строчку {}
    - В открывшемся окне в поле "Заголовки" просмотреть URL запроса, метод запроса и код статуса
    - Нажать на поле "Ответ" на панели инструментов
    - Внимательно изучить информацию
  expected-result: |
    При проверке через Devtools запросы и ответы без ошибок
