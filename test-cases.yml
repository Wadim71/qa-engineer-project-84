- summary: |
    Успешный перевод всего сайта после переключения на русский язык
  requirement: |
    После переключения на русский язык весь сайт будет переведён на русский язык
  prerequisites: |
    Пользователь находится на странице https://hexlet-products-store.vercel.app/
  test-data: |
    Empty
  steps:
    - Кликнуть на поле "Language"
    - Из выпавшего списка выбрать русский язык
    - Выбрать любой товар
    - Кликнуть на поле выбранного товара
    - После перехода на страницу товара кликнуть на поле "В корзину"
